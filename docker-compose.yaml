services:
  core:
    build: ./cr-core
    container_name: cr-core
    stdin_open: true
    tty: true
    volumes:
      - ./cr-core:/app
    networks:
      - cr-net
    healthcheck:
      test: ["CMD", "test", "-d", "/app"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api-gateway:
    build: ./cr-ag
    container_name: cr-ag
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - CORE_URL=http://core:3002
    networks:
      - cr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./cr-frontend
    container_name: cr-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASEURL=http://api-gateway:3001
    networks:
      - cr-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  cr-net:
    driver: bridge
    